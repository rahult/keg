name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keg targets macOS 26 and depends on apple/container, which is Apple
    # Silicon only — there is no runner other than this one that can build it.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The bundling and inside-out signing in `make bundle` is easy to break
      # without noticing, because nothing else exercises it until release time
      # — when a tag already exists. Signing needs a certificate the runner
      # does not have, so check the layout only.
      - name: Check the app bundle lays out correctly
        run: |
          swift build -c release
          make bundle
          test -x release/Keg.app/Contents/MacOS/Keg
          test -d release/Keg.app/Contents/Frameworks/Sparkle.framework
          plutil -lint release/Keg.app/Contents/Info.plist
