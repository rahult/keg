name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # The release workflow dispatches this once it has committed a new
  # appcast.xml, so a release reaches the update feed without waiting for
  # another push.
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) on first deploy.
          enablement: true

      # The site is hand-written HTML with no build step, so the directory
      # ships as-is. site/CNAME is what points keg.rahultrikha.com here.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Twice in two releases the deploy did not find the artifact the step
      # above had just uploaded ("No artifacts named github-pages were found
      # for this workflow run"), and a run started again by hand passed with
      # nothing changed. So a first try that fails is followed by a wait and
      # one more; the job fails only if both do.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages, once more
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
